# Publishes the benchmark report (bench/report) as a GitHub Pages site: https://<owner>.github.io/<repo>/
# One-time setup by the repository owner: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until then this workflow fails at the deploy step and nothing is published. The page is static and needs no build:
# (Runs on every push that touches the report or the results.) data.js is generated by `node bench/report/build.mjs` and committed with the results.
name: Benchmark report

on:
  push:
    branches: [main]
    paths: ["bench/report/**", "bench/results/**", ".github/workflows/benchmark-report.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only what the page loads: not the build and serve scripts next to it.
      - run: |
          mkdir _site
          cp bench/report/index.html bench/report/style.css bench/report/app.js bench/report/data.js _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
