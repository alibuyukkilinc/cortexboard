name: Bug report
description: Something in Cortex does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. npx cortexboard init
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Cortex version
      description: "`npx cortexboard --version`"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Single project (cortexboard start / mcp)
        - Team server (cortexboard hub start)
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Node.js version, and the AI tool if it matters (Claude Code, Cursor, Codex...).
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, hostnames and anything private before pasting.
      render: text
